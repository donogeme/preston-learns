<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preston Feeds Mittens 🐱</title>
  <link rel="stylesheet" href="../../css/story.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .story-image {
      width: 100%;
      max-width: 600px;
      height: auto;
      border-radius: 15px;
      margin: 20px auto;
      display: block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    .story-text {
      font-size: 24px;
      line-height: 1.6;
      margin: 20px 0;
      color: #2d3436;
    }
    
    .question {
      font-size: 26px;
      font-weight: bold;
      color: #e17055;
      margin: 20px 0;
      text-align: center;
    }
    
    .choices-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin: 30px 0;
    }
    
    .choice-button {
      padding: 20px;
      font-size: 18px;
      border: 3px solid #dfe6e9;
      border-radius: 15px;
      background: white;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .choice-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      border-color: #74b9ff;
    }
    
    .choice-button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
    
    .choice-button.correct {
      border-color: #00b894;
      background: #d5ffe6;
      animation: celebrate 0.5s;
    }
    
    .choice-button.incorrect {
      border-color: #d63031;
      background: #ffeaea;
      animation: shake 0.5s;
    }
    
    .choice-emoji {
      font-size: 48px;
      display: block;
      margin-bottom: 10px;
    }
    
    .feedback {
      padding: 15px;
      margin: 20px 0;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      animation: fadeIn 0.5s;
    }
    
    .feedback.correct {
      background: #d5ffe6;
      color: #00b894;
      border: 2px solid #00b894;
    }
    
    .feedback.incorrect {
      background: #ffeaea;
      color: #d63031;
      border: 2px solid #d63031;
    }
    
    .hint {
      font-size: 16px;
      color: #636e72;
      text-align: center;
      font-style: italic;
      margin: 15px 0;
    }
    
    .page-indicator {
      text-align: center;
      color: #b2bec3;
      font-size: 14px;
      margin-bottom: 10px;
    }
    
    .facts-list {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
    }
    
    .fact-item {
      font-size: 20px;
      margin: 10px 0;
      padding-left: 10px;
    }
    
    #nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .nav-button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #b2bec3;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }
    
    .nav-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    
    .nav-button.primary {
      background: #74b9ff;
    }
    
    .nav-button.primary:hover {
      background: #0984e3;
    }
    
    .nav-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .read-aloud-button {
      padding: 15px;
      font-size: 24px;
      border: none;
      border-radius: 50%;
      background: #fdcb6e;
      cursor: pointer;
      transition: all 0.3s;
      width: 60px;
      height: 60px;
    }
    
    .read-aloud-button:hover {
      background: #f39c12;
      transform: scale(1.1);
    }
    
    .read-aloud-button.speaking {
      animation: pulse 1s infinite;
    }
    
    word {
      cursor: pointer;
      text-decoration: underline;
      color: #0984e3;
      font-weight: bold;
    }
    
    word:hover {
      color: #74b9ff;
    }
    
    @keyframes celebrate {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    @media (max-width: 600px) {
      .story-text {
        font-size: 20px;
      }
      
      .question {
        font-size: 22px;
      }
      
      .choice-button {
        font-size: 16px;
        padding: 15px;
      }
      
      .choice-emoji {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="story-content"></div>
    <div id="nav-buttons"></div>
  </div>
  
  <script src="story.js"></script>
</body>
</html>
